
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Positioning</h1>
    </header>

    <nav class="sticky-box">
        Sticky Navigation
    </nav>

    <main>
        <div class="box static">
            Static
            <p>Default position</p>
        </div>

        <div class="box relative">
            Relative
            <p>Moves from its original position</p>
        </div>

        <div class="absolute-container">
            <div class="box absolute">
                Absolute
                <p>Positioned inside this container</p>
            </div>
        </div>

        <div class="box normal">
            Normal Content
            <p>Scroll down to see Fixed and Sticky</p>
        </div>

        <div class="box normal">
            More Content
            <p>Keep scrolling!</p>
        </div>

        <div class="box normal">
            Extra Content
            <p>Testing page scrolling</p>
        </div>
    </main>

    <div class="fixed-box">
        Fixed
        <p>Stays on screen</p>
    </div>

</body>
</html>
